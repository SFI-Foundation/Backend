# nginx site for the SFI backend.
#   sfi-api.opencodingsociety.com  ->  Flask/gunicorn on localhost:8605
#
# Install on the server:
#   sudo cp nginx_sfi_api_8605.conf /etc/nginx/sites-available/sfi-api
#   sudo ln -s /etc/nginx/sites-available/sfi-api /etc/nginx/sites-enabled/sfi-api
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d sfi-api.opencodingsociety.com   # adds the 443 block + cert
#
# Flask owns CORS (see __init__.py ALLOWED_ORIGINS). Do NOT add
# Access-Control-Allow-* headers here or browsers will see duplicates.
server {
    listen 80;
    listen [::]:80;
    server_name sfi-api.opencodingsociety.com;

    client_max_body_size 20M;

    location / {
        proxy_pass http://localhost:8605;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
